# M2 Pipeline Configuration
# Edit this file to tune the pipeline without touching Python code.

data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  calibration_split: 0.15          # 15% of data reserved ONLY for probability calibration

labeling:
  pt_atr: 2.0                       # Profit-Taking: price must move +2 ATRs
  sl_atr: 1.0                       # Stop-Loss: price must fall -1 ATR
  max_holding_bars: 48              # Timeout: 48 H1 bars = 2 trading days

cross_validation:
  n_splits: 5
  embargo_pct: 0.01                 # 1% of total bars embargoed after each test fold

xgboost:
  n_estimators: 500
  learning_rate: 0.05
  max_depth: 4
  subsample: 0.8
  colsample_bytree: 0.8
  min_child_weight: 5
  random_state: 42

calibration:
  method: "isotonic"                # 'isotonic' (recommended) or 'sigmoid'

sizing:
  threshold: 0.54                   # Minimum calibrated probability to open a trade
  scale_by_confidence: false        # If true, size is proportional to p above threshold
